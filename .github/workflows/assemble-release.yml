name: Assemble release tree
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  assemble:
    if: ${{ hashFiles('.release-chunks/manifest.tsv') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble large files
        shell: bash
        run: |
          while IFS=$'\t' read -r id mode count path; do
            mkdir -p "$(dirname "$path")"
            : > "$path"
            for chunk in ".release-chunks/$id"/*; do
              cat "$chunk" >> "$path"
            done
            if [ "$mode" = "100755" ]; then chmod +x "$path"; fi
          done < .release-chunks/manifest.tsv
          rm -rf .release-chunks
          rm -f .github/workflows/assemble-release.yml
      - name: Commit assembled release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble v1.0.0 release candidate"
          git push
